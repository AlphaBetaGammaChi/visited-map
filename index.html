<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visited Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">🗺️ <span>Visited Map</span></div>
  <nav id="collection-tabs"></nav>
  <button id="profile-btn" title="Profiles"><span id="profile-dot"></span><span id="profile-name">…</span></button>
</header>

<main>
  <aside>
    <div class="side-tabs">
      <button class="side-tab active" data-tab="checklist">Checklist</button>
      <button class="side-tab" data-tab="stats">Stats</button>
    </div>

    <section id="tab-checklist" class="side-panel active">
      <input id="search" type="search" placeholder="Search sites…" autocomplete="off">
      <div id="checklist-progress"></div>
      <ul id="checklist"></ul>
    </section>

    <section id="tab-stats" class="side-panel">
      <div id="stats-summary"></div>
      <h3>By region</h3>
      <table id="stats-regions"><thead>
        <tr><th>Region</th><th class="num">Visited</th><th></th></tr>
      </thead><tbody></tbody></table>
      <h3>Recent visits</h3>
      <ul id="stats-recent"></ul>
    </section>
  </aside>

  <div id="map-wrap">
    <div id="map"></div>
    <div id="mode-toggle">
      <button class="mode-btn active" data-mode="pins">📍 Sites</button>
      <button class="mode-btn" data-mode="regions">🗺️ Regions</button>
    </div>
    <div id="region-legend" hidden></div>
  </div>
</main>

<div id="profile-modal" class="modal" hidden>
  <div class="modal-box">
    <h2>Profiles</h2>
    <ul id="profile-list"></ul>
    <div class="modal-row">
      <input id="new-profile-name" type="text" placeholder="New profile name" maxlength="40">
      <button id="new-profile-btn">Create</button>
    </div>
    <div class="modal-row">
      <button id="export-btn">⬇ Export profile</button>
      <button id="import-btn">⬆ Import profile</button>
      <input id="import-file" type="file" accept=".json" hidden>
    </div>
    <p class="muted">Data is stored in this browser only. Export to move a profile between devices.</p>
    <button class="modal-close" id="profile-close">Close</button>
  </div>
</div>

<div id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
